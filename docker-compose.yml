services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/pulse
      REDIS_URL: redis://redis:6379
      # No default on purpose: production must never boot with a well-known
      # JWT secret. Set JWT_SECRET in .env before `docker compose up`.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # workersRunner supervises BOTH workers (monitor checks + notifications),
    # matching the production topology (Northflank pulse-workers service).
    command: ["node", "apps/api/dist/workersRunner.cjs"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/pulse
      REDIS_URL: redis://redis:6379
      # Workers don't issue JWTs, but env.ts validates JWT_SECRET in production
      # for every entrypoint — same required secret as the api service.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env (see .env.example)}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
